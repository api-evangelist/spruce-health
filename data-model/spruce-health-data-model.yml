summary:
  entities: 22
  schemas_in_spec: 169
  operations: 47
  central_entity: conversation
  join_to_external_systems: contact_integrationLink
  polymorphism:
  - 'member is a union of organization | team | teammate, discriminated on type'
  - 'conversationItem carries variant payloads (phone call event, page) alongside message content'
  - 'conversation is secure | note'

notable:
- >-
  Contacts, teammates, teams and the organization share one entity_ id space. A single
  id field can therefore legitimately hold any of them, and the `type` field - not the
  id shape - is the discriminator.
- >-
  Nearly every read object carries both apiURL and appURL, so one payload serves a
  machine and a human without a second lookup.
- >-
  Delivery state for webhooks is a first-class readable resource rather than an internal
  detail, which is unusual at this size of API.

