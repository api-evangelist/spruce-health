  - referenced_by: conversationItem.author
  - referenced_by: conversation.assignedToMemberId
  - referenced_by: savedMessage.creatorMemberId
  - referenced_by: scheduledMessage.sendAsInternalMemberId

- name: team
  schema: team
  id_prefix: entity_
  fields: [id, object, type, name]
  operations: [TeamMembers]
  relationships:
  - belongs_to: organization
  - has_many: teammate
