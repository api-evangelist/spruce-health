provider: Spruce Health
providerId: spruce-health
description: >-
  The entity-relationship graph of the Spruce Health API, derived from the 169 schemas
  and their $ref links in the OpenAPI Spruce publishes, with id prefixes read from the
  worked example payloads in the Webhooks Overview. Spruce models a healthcare practice
  as one organization owning two intersecting graphs - a contact graph (who the practice
  talks to) and a conversation graph (what was said, on which channel) - joined by the
  conversation, which is the hinge of the whole model.

root: organization
root_note: >-
  Every object is scoped to one organization. There is no cross-organization read, and
  webhook events are explicitly scoped to their owning organization. GET /organization
  returns the organization id that appears as the owner or a member of most other
  objects.

id_convention:
  style: prefixed-opaque
  prefixes:
  - prefix: entity_
    entities: [organization, teammate, team, contact]
    note: >-
      The single most important shape in the model. Organizations, teams, teammates and
      contacts are all "entities" sharing one id space and one prefix, which is why an
      organization id can appear wherever a member id is expected.
  - prefix: entityContact_
    entities: [phoneNumber, emailAddress, faxNumber]
  - prefix: entityCustomField_
    entities: [customContactField]
  - prefix: t_
    entities: [conversation]
  - prefix: ti_
    entities: [conversationItem]

entities:

- name: organization
  schema: organization
  id_prefix: entity_
  operations: [Organization]
  fields: [id, name, object, type]
  description: The practice itself. The tenant boundary for every other object.
  relationships:
  - has_many: member
    via: GET /organization/members
  - has_many: phoneLine
    via: GET /phonelines
  - has_many: contact
  - has_many: conversation
  - has_many: webhookDestinationEndpoint

- name: member
  schema: organizationMember
  id_prefix: entity_
  operations: [OrganizationMembers, OrganizationMember]
  description: >-
    A polymorphic union - a member is an organization, a team, or a teammate. Callers
    discriminate on the `type` field, and the organization appears in its own member
    list.
  variants: [organization, team, teammate]
  relationships:
  - belongs_to: organization

- name: teammate
  schema: teammate
  id_prefix: entity_
  fields: [id, object, type, displayName, email, isAdmin, isSuspended]
  relationships:
  - belongs_to: organization
  - has_many: team
