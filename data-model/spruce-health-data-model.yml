  relationships:
  - belongs_to: conversation
    via: conversationId
  - has_one: member
    via: author
  - has_many: attachment
    via: attachments
  - has_one: transcription
    via: transcriptionId

- name: conversationTag
  operations: [ConversationTags, CreateConversationTag]
  relationships:
