- name: conversation
  schema: conversation
  id_prefix: t_
  operations: [ListConversations, CreateConversation, Conversation, UpdateConversation, ConversationItems, PostConversationMessage]
  fields: [id, object, apiURL, appURL, title, subtitle, createdAt, lastMessageAt, archived, isReadOnly, assignedToMemberId, associatedContactIds, internalMemberIds, externalParticipants, internalEndpoint, tags]
  description: >-
    A message thread, and the hinge of the model. A conversation is bound to the
    internal endpoint (phone line, fax number, email address or Spruce Link) it runs
    over, so channel is a property of the thread rather than of each message.
  variants:
