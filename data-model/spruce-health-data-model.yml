- name: contact
  schema: contact
  id_prefix: entity_
  operations: [ListContacts, SearchContacts, CreateContact, Contact, UpdateContact, DeleteContact, SendInvite, ContactConversations]
  fields: [id, object, apiURL, appURL, category, displayName, givenName, middleName, familyName, companyName, dateOfBirth, gender, genderDetail, pronouns, phoneNumbers, emailAddresses, faxNumbers, tags, customContactFields, organizationContactFields, integrationLinks, internalMemberIds, hasAccount, hasPendingInvite, canEdit, canDelete, created]
  description: >-
    A patient or other party the practice communicates with. Carries both apiURL and
    appURL, so an integration can deep-link a human into the Spruce app from the same
    payload a machine reads.
  relationships:
  - has_many: phoneNumber
    via: phoneNumbers
  - has_many: emailAddress
    via: emailAddresses
  - has_many: faxNumber
