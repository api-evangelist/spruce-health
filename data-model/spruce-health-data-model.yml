  operations: [ConversationItem, DeleteConversationItem, ConversationItems, PostConversationMessage, PostMessageFromEndpoint]
  fields: [id, object, apiURL, appURL, conversationId, conversation, author, createdAt, modifiedAt, direction, isInternalNote, attachments, buttons, event, canDelete]
  description: >-
    One entry in a thread - a message, a phone call, a fax, a page, or a system event.
    The `direction` field (inbound/outbound) is what lets an integrator tell a patient
