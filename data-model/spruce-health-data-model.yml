    note: In-app encrypted thread with one or more patient contacts who have a Spruce account or a pending invite.
  - type: note
    note: Internal-only documentation thread; associated contacts have no access to it.
  relationships:
  - has_many: conversationItem
    via: GET /conversations/{conversationId}/items
  - has_many: scheduledMessage
    via: GET /conversations/{conversationId}/scheduledmessages
  - belongs_to: internalEndpoint
    via: internalEndpoint
  - has_many: contact
    via: associatedContactIds
  - has_many: member
    via: internalMemberIds
  - has_one: member
    via: assignedToMemberId
  - has_many: conversationTag
