aid: spruce-health
name: Spruce Health
review:
  question: Does Spruce Health expose a documented public WebSocket API?
  answer: false
  date: '2026-08-15'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: 'No AsyncAPI document was authored. Spruce''s public developer surface is the

    Spruce Public API - a request/response REST API over HTTPS

    (https://api.sprucehealth.com/v1) authenticated with a Bearer token. Spruce''s

    real-time delivery is done with outbound webhooks: the platform POSTs event

    payloads (contact.*, conversation.*, conversationItem.*) to HTTPS endpoints an

    organization registers. That is server-to-endpoint HTTP, not a bidirectional

    WebSocket transport on Spruce''s own API, so there is no ws:// or wss:// surface

    to model.

    '
findings:
  summary: 'Spruce Health does not publish a documented public WebSocket API. Spruce is a

    HIPAA-compliant healthcare communication platform (secure messaging, voice,

    video, team chat, e-fax, payments, phone lines). Its developer offering, the

    Spruce Public API, is REST over HTTPS at base https://api.sprucehealth.com/v1,

    authenticated with an organization Bearer token generated in Settings after

    Spruce Support enables API access. The API manages Contacts, Conversations,

    conversation items / Messages, internal endpoints and phone lines, media, and

    scheduled messages, and it registers Webhook endpoints for real-time events.

    Real-time notification is delivered by outbound webhooks (HTTP callbacks), not

    by a WebSocket. No realtime, bidirectional, or streaming WebSocket endpoint is

    documented anywhere in Spruce''s developer materials.

    '
  openSource: 'Spruce Health is a proprietary, closed-source commercial SaaS. There is no

    self-hostable open-source component. API access is gated: it is part of the

    Communicator plan ($49/user/month) and an organization must contact Spruce

    Support to have API access enabled before administrators can generate tokens.

    '
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.sprucehealth.com/v1
    documented: true
    note: Spruce Public API - Contacts, Conversations, Messages, endpoints, and webhook management. Bearer
      token auth.
  - protocol: Webhook
    scheme: https
    documented: true
    note: Outbound HTTP callbacks for contact / conversation / conversationItem events. Server-to-endpoint
      HTTP, not WebSocket. 1000 events/min per endpoint, 5s 2XX window, retries every 2 min up to 10 attempts.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket endpoint is documented in Spruce's API reference or webhooks overview as of the
      review date.
  endpointsConfirmedRest:
  - All 47 operations are now confirmed from the published OpenAPI; see openapi/_original/spruce-health-openapi.json
  endpointsModeled: false
  endpointsModeledNote: 'SUPERSEDED 2026-08-15. The earlier round could not locate a published specification
    and authored an honestly modeled 38-operation OpenAPI from the operation catalog in developer.sprucehealth.com/llms.txt.
    Spruce DOES publish a machine-readable OpenAPI: its ReadMe developer portal references it as oasPublicUrl
    @spruce/v1.0#13needamst2v4m6 and serves it from https://dash.readme.com/api/v1/api-registry/13needamst2v4m6
    (HTTP 200, OpenAPI 3.0.0, info.title ''Spruce Health API'', servers[0] https://api.sprucehealth.com/v1,
    47 operations, 169 schemas). It has been harvested verbatim to openapi/_original/spruce-health-openapi.json
    and split by tag; the modeled spec has been deleted. Several modeled paths were wrong - notably /conversations/{conversationId}/items/{itemId}
    (real: /conversationItems/{conversationItemId}), /proxy-calls (real: /internalendpoints/{internalEndpointId}/calls),
    /contacts/{contactId}/integration-links (real: /integrationlinks) and /scheduled-messages (real: /scheduledmessages)
    - and the Organization, Phone Lines, Teams, Transcription and contact-invite surfaces were missing
    entirely.'
  webhookEvents:
  - contact.created
  - contact.updated
  - contact.deleted
  - contact.merged
  - conversation.created
  - conversation.updated
  - conversation.deleted
  - conversationItem.created
  - conversationItem.updated
  - conversationItem.deleted
  - conversationItem.restored
  - scheduledMessage.created
  - scheduledMessage.updated
  - scheduledMessage.deleted
  - scheduledMessage.sent
  webhookEventsNote: 15 event types. The four scheduledMessage.* events were added 2026-07-31 and contact.merged
    on 2026-04-15; both were absent from the previous review.
