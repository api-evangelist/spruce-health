description: >-
  A recorded ABSENCE. Every /.well-known/ path was probed on all four Spruce Health
  hosts and every one returned 404. Spruce serves no security.txt, no OpenID or OAuth
  authorization-server metadata, no api-catalog, no ai-plugin manifest and no A2A agent
  card. No WellKnown, SecurityTxt or AgentCard pointer is wired into apis.yml as a
  result - this file documents that the surface is not served, and must not be read as
  evidence that it is.

