  note: >-
    Two machine-readable documents ARE served by Spruce, just not from /.well-known/ -
    an llms.txt on each of the docs and marketing hosts. Both are saved verbatim under
    llms/. A CAA record on sprucehealth.com publishes a security contact
    (iodef mailto:security@sprucehealth.com), which is the only machine-readable
    security contact Spruce exposes; it is recorded in
    security/spruce-health-domain-security.yml and is NOT a security.txt.

