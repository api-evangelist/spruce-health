included_in_every_plan:
- name: HIPAA Business Associate Agreement
  detail: >-
    Every eligible organization automatically receives a signed BAA as part of the terms
    of service - no separate agreement, no opt-in, no extra fee. Since 2026-07-09 the BAA
    also brings formal Qualified Service Organization support for 42 CFR Part 2
    communications.
  source: https://sprucehealth.com/llms.txt
- name: eFax
- name: Spruce Visits (patient assessments, incl. PHQ-9 and GAD-7)
- name: Support
  detail: 'Monday-Friday 8am-8pm ET plus urgent weekend cover; no tiered support gating.'
enterprise:
  contact_sales: true
  email: sales@sprucehealth.com
  detail: Custom pricing is available for larger practices and annual contracts; the terms are not published.
