shared_rules:
  auth: 'Authorization: Bearer <organization-token>; 403 on a missing, incorrect or disabled token (never 401).'
  idempotency: >-
    s-idempotency-key on every POST and PATCH, max 255 chars, retained 24 hours. A
    duplicate is REJECTED with 422, not replayed - so a 422 on retry means the first
    attempt landed. This is the single most important deviation from the Stripe-style
    convention agents are usually trained on.
  rate_limits: >-
    Per organization, not per credential. Four response headers across a 60-second and a
    24-hour window; an absent header means unlimited on that dimension. No documented
    exhaustion status - drive backoff from the remaining counters, not from a 429.
  pagination: pageSize (max 500) + paginationToken; hasMore and totalCount in the response. paginationToken cannot be combined with startFrom.
  errors: '{statusCode, type, message} as application/json. Not RFC 9457.'
  tracing: s-request-id on every response; quote it to Spruce Support.
  async: >-
    Message posts, conversation creation and item deletion complete asynchronously and
    return a correlation id (requestID / RequestID / postMessageRequestId / requestId) to
    match against the conversationItem.created or conversationItem.deleted webhook event.

