access_lifecycle:
  self_serve: false
  gate: >-
    API access is part of the Communicator plan and must additionally be enabled by
    Spruce Support before an administrator can generate a token from the API Access
    section of Settings.
  request_form: https://sprucehealth.com/spruce-api
  revocation: >-
    Tokens can be disabled by an administrator; a disabled or incorrect token returns
    403 on every request.

