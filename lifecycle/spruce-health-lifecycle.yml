provider: Spruce Health
providerId: spruce-health
description: >-
  Versioning, deprecation, status and support posture for the Spruce Health API. Spruce
  runs a public Atlassian Statuspage that tracks the API as its own component and a
  dated public changelog with an RSS feed, but publishes no written versioning policy,
  no deprecation policy, and no SLA.

versioning:
  style: uri-path
  current_version: v1
  base_url: https://api.sprucehealth.com/v1
  spec_version: 1.0.0
  policy_published: false
  policy_url: null
  note: >-
    The major version is pinned in the base path. Spruce has shipped only v1 and gives
    no published guidance on how a v2 would be introduced or how long v1 would be
    supported. Changes observed on the What's New feed have been additive (new webhook
    event types, new fields on existing objects, new operations), which is consistent
    with a single long-lived version but is not a commitment.

deprecation:
  policy_published: false
  policy_url: null
  sunset_header: not-documented
  deprecation_header: not-documented
  rfc8594: false
  deprecated_operations: []
  deprecated_operation_count: 0
  note: >-
    No operation in the OpenAPI carries deprecated: true, and Spruce publishes no
    deprecation or sunset policy. The nearest thing to a published retirement notice is
    a data limitation rather than an API one: voicemail transcriptions created before
    November 2025 are in a legacy store and GET /transcriptions/{transcriptionId}
    answers 404 for them.

