description: Crosswalk between Spruce Health's MCP surface and its REST operations. It is deliberately
  one-sided. Spruce serves a real remote MCP endpoint at https://developer.sprucehealth.com/mcp,
  but tools/list answers 401 without an organization token, so not a single tool name is known. Every
  one of the 47 REST operations is therefore recorded as rest_only, and crosswalk[] is empty rather
  than populated by guesswork - binding invented tool names to real operationIds would manufacture
  exactly the agent surface this file exists to measure.
