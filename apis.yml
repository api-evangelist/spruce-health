aid: spruce-health
url: https://raw.githubusercontent.com/api-evangelist/spruce-health/refs/heads/main/apis.yml
name: Spruce Health
kind: company
description: 'Spruce Health is a HIPAA-compliant healthcare communication platform that unifies phone,
  SMS, secure messaging, video, e-fax, team chat, mobile payments and VoIP phone lines into one system
  for medical practices, with AI-enabled voicemail transcription, summarization and call routing. Every
  eligible organization receives a signed HIPAA Business Associate Agreement as part of the terms of service,
  and since July 2026 that BAA also carries formal Qualified Service Organization support for 42 CFR Part
  2. Spruce is SOC 2 Type II audited annually. The Spruce Public API is a RESTful, Bearer-token interface
  at https://api.sprucehealth.com/v1 spanning 47 operations across contacts, conversations, conversation
  items, internal endpoints and phone lines, media, organization members and teams, saved and scheduled
  messages, AI transcriptions, and webhook endpoint management. It ships a real OpenAPI 3.0 definition,
  a first-class s-idempotency-key on every mutating request, four rate-limit response headers across a
  60-second and a 24-hour window, and 15 HMAC-signed webhook event types. API access is gated twice: it
  is part of the Communicator plan, and an organization must additionally contact Spruce Support to have
  API access enabled before an administrator can generate a token.'
accessModel:
  pricing: freemium
  onboarding: open
  trial: true
  try_now: true
  public: true
  label: Freemium (free trial) · Open access
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/spruce-health.png
