description: >-
  Spruce Health publishes a dated product changelog at sprucehealth.com/whats-new with a
  machine-readable RSS feed. It is a product changelog rather than an API changelog -
  API entries are tagged in the title with the "Spruce Public API" or "Spruce API"
  prefix and are interleaved with app, telephony and billing releases. There is no
  changelog on the developer host; developer.sprucehealth.com/changelog returns 404.

