  categories:
  - New Feature
  - Improvement
  - Announcement
  plan_labels:
  - Communicator Plan
  note: >-
    Entries carry a category and sometimes a plan label, but nothing marks an entry as
    breaking. Prior to 2026-06-23 entries were monthly digests (titled "March 2026",
    "February 2026", ...); Spruce moved to individually dated entries when it launched
    the new What's New home on 2026-06-23.

