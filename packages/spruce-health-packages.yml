description: >-
  A recorded ZERO. Spruce Health publishes no first-party client library for the Spruce
  Public API in any package registry, and none in its GitHub organization. Every
  documented integration path is a raw HTTPS call - the docs and the Webhooks Overview
  show curl, and the only code Spruce ships is a Go webhook-signature verification
  snippet inside a documentation page, not a distributable package.

