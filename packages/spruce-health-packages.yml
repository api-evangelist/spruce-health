    a page, not a package.

assessment: >-
  For an integrator this is the notable gap in an otherwise well-specified API. Spruce
  publishes a real 47-operation OpenAPI, so a generated client is one command away and
  the absence of a hand-maintained SDK costs less than it would elsewhere. But there is
  no versioned, dated, first-party artifact in any registry, which means there is also
  no package-release signal by which to judge whether the client surface is being
  maintained. The currency evidence for this provider has to come from the OpenAPI and
  the What's New feed instead - both of which are current, the feed as recently as
  2026-08-11.

