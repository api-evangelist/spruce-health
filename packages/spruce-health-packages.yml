  probed: '2026-08-15'
  http_status: 200
  public_repos_scanned: 64
  api_client_repos: 0
  finding: >-
    The organization is real and active - repositories were pushed to as recently as
    2026-08-10 - but it contains no client library for the Spruce Public API. Its public
    repos are internal engineering tools (agentrules, link-shortener, twimulator, two
    GitHub Actions), a Go library for the Hint Health integration (go-hint), and a long
    tail of forks of third-party Go, Swift and Objective-C dependencies (convoy, pgx,
    mock, ReactiveCocoa, Masonry). Nothing here is distributed as, or documented as, a
    Spruce API SDK.
  closest_adjacent:
  - repo: go-hint
    url: https://github.com/sprucehealth/go-hint
    language: Go
    pushed: '2026-08-10'
    note: >-
      A Go client for Hint Health's API - one of the EHR platforms Spruce integrates
      WITH. It calls someone else's API; it is not a client for Spruce's own.
  - repo: convoy-go
    url: https://github.com/sprucehealth/convoy-go
    language: Go
    pushed: '2024-10-28'
    note: >-
      A fork of the Convoy webhooks-gateway Go SDK. Adjacent to Spruce's webhook
      delivery but a third-party project, not a Spruce API client.

